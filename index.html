<!--
  WTFdd Legacy Return Guard — PATCH ONLY

  DO NOT deploy this file by itself. Paste it immediately before the closing
  </body> tag of the canonical WTFdd HTML in the GitHub repository.

  Effect: Back/Exit actions from the current WTFdd experience can no longer
  return a visitor to the legacy landing screen. They reopen the current
  WTFdd city flow instead. The initial 21+ entry remains available on a fresh
  session; the old screen is suppressed only after the current flow is entered.
-->
<style id="wtf-legacy-return-guard-style-v1">
  /* Once the current WTFdd experience has been entered, the old landing may never be shown again. */
  body.wtf-new-flow-seen #wtfLandingOverlay{display:none!important;pointer-events:none!important;}
</style>
<script id="wtf-legacy-return-guard-v1">
(function(){
  var seenKey='wtfNewFlowSeen';
  function q(id){return document.getElementById(id);}
  function markSeen(){
    document.body.classList.add('wtf-new-flow-seen');
    try{sessionStorage.setItem(seenKey,'1');}catch(error){}
  }
  function hasSeen(){
    try{return sessionStorage.getItem(seenKey)==='1'||document.body.classList.contains('wtf-new-flow-seen');}catch(error){return document.body.classList.contains('wtf-new-flow-seen');}
  }
  function hideLegacy(){
    var gate=q('wtfLandingOverlay');
    if(!gate)return;
    gate.classList.remove('open');
    gate.setAttribute('aria-hidden','true');
  }
  function openCurrentFlow(){
    markSeen();hideLegacy();
    var current=q('wtf2Overlay');
    if(current){current.classList.add('open');current.setAttribute('aria-hidden','false');}
    if(typeof window.wtfOpenCityLanding==='function'){
      try{window.wtfOpenCityLanding();}catch(error){}
    }
    document.body.style.overflow='hidden';
  }
  function guardLegacyReturn(){
    if(!hasSeen())return;
    var legacy=q('wtfLandingOverlay'),current=q('wtf2Overlay');
    if(legacy&&legacy.classList.contains('open')&&(!current||!current.classList.contains('open'))){
      openCurrentFlow();
    }else if(legacy){
      hideLegacy();
    }
  }
  window.addEventListener('click',function(event){
    var enter=event.target&&event.target.closest&&event.target.closest('#wtfLandingEnterBtn');
    if(enter){markSeen();return;}
    var exit=event.target&&event.target.closest&&event.target.closest('#wtf2Exit,[data-wtf-legacy-return],.wtf2-old-site-pin');
    if(!exit)return;
    event.preventDefault();event.stopImmediatePropagation();openCurrentFlow();
  },true);
  window.addEventListener('popstate',function(){setTimeout(guardLegacyReturn,0);});
  window.addEventListener('pageshow',function(){setTimeout(guardLegacyReturn,0);});
  if(hasSeen())markSeen();
  setInterval(guardLegacyReturn,180);
})();
</script>
<!-- End WTFdd Legacy Return Guard Patch -->
